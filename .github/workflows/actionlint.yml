name: GitHub Actions Workflow Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint on editable workflows
        run: |
          set -euo pipefail
          find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) \
            ! -name "worker-controller-ci.yml" \
            ! -name "worker-pipeline.yml" \
            -print0 | xargs -0 ./actionlint -color \
              -ignore 'unexpected key "queue" for "concurrency" section'
