name: Controller Ingestion Scheduling CI

on:
  pull_request:
    paths:
      - "controller/**"
      - ".github/workflows/controller-ingestion-scheduling-ci.yml"
      - ".github/workflows/controller-ingestion-scheduling-operations.yml"
  push:
    branches:
      - main
    paths:
      - "controller/**"
      - ".github/workflows/controller-ingestion-scheduling-ci.yml"
      - ".github/workflows/controller-ingestion-scheduling-operations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-ingestion-scheduling-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ingestion scheduling controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controller/package-lock.json

      - name: Install controller dependencies
        working-directory: controller
        run: npm ci

      - name: Run focused scheduling tests
        working-directory: controller
        run: npm run test:ingestion-scheduling

      - name: Run controller typecheck
        working-directory: controller
        run: npm run typecheck

      - name: Render enabled and disabled dry-run configs
        shell: bash
        run: |
          set -euo pipefail
          node controller/scripts/render-ingestion-scheduling-config.mjs true controller/wrangler.ingestion-enabled.generated.jsonc "$RUNNER_TEMP/enabled-report.json" "$GITHUB_SHA" "scheduling-ci-enabled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node controller/scripts/render-ingestion-scheduling-config.mjs false controller/wrangler.ingestion-disabled.generated.jsonc "$RUNNER_TEMP/disabled-report.json" "$GITHUB_SHA" "scheduling-ci-disabled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (
            cd controller
            npx wrangler deploy --dry-run -c wrangler.ingestion-enabled.generated.jsonc --outdir "$RUNNER_TEMP/enabled-build"
            npx wrangler deploy --dry-run -c wrangler.ingestion-disabled.generated.jsonc --outdir "$RUNNER_TEMP/disabled-build"
          )

      - name: Upload value-free dry-run evidence
        uses: actions/upload-artifact@v6
        with:
          name: controller-ingestion-scheduling-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/enabled-report.json
            ${{ runner.temp }}/disabled-report.json
          if-no-files-found: error
          retention-days: 90
