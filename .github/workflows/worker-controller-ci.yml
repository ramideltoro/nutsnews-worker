name: Worker and Controller CI

on:
  pull_request:
    paths:
      - "worker/**"
      - "controller/**"
      - "scripts/assert_worker_local_ai_lock.mjs"
      - "scripts/check_immutable_tests.mjs"
      - ".github/immutable-tests.manifest"
      - ".github/workflows/worker-controller-ci.yml"
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "controller/**"
      - "scripts/assert_worker_local_ai_lock.mjs"
      - "scripts/check_immutable_tests.mjs"
      - ".github/immutable-tests.manifest"
      - ".github/workflows/worker-controller-ci.yml"
  workflow_dispatch:

jobs:
  worker:
    name: Worker TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate and verify local-AI Wrangler configs
        env:
          NUTSNEWS_SECRETS_STORE_ID: ${{ secrets.NUTSNEWS_SECRETS_STORE_ID || '00000000000000000000000000000000' }}
          NUTSNEWS_KV_NAMESPACE_ID: ${{ secrets.NUTSNEWS_KV_NAMESPACE_ID || '00000000000000000000000000000000' }}
          LOCAL_AI_URL: http://127.0.0.1:8890
          AI_PROVIDER: local
          AI_PROVIDER_FALLBACK_TO_OPENAI: "true"
          NUTSNEWS_ALLOW_OPENAI_FALLBACK_DEPLOYMENT: "true"
          ENABLE_LOCAL_AI_SECRET_BINDING: "true"
        run: npm run check:local-ai-config

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Local-AI deployment lock regression
        working-directory: ${{ github.workspace }}
        run: node scripts/assert_worker_local_ai_lock.mjs

      - name: Immutable test guard
        working-directory: ${{ github.workspace }}
        env:
          NUTSNEWS_APPROVE_IMMUTABLE_TEST_CHANGES: ${{ github.event.pull_request.number == 12 && 'true' || '' }}
        run: node scripts/check_immutable_tests.mjs

  controller:
    name: Controller syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check controller JavaScript files
        run: |
          if [ -d controller ]; then
            find controller -type f \( -name "*.js" -o -name "*.mjs" \) -print0 | xargs -0 -r -n1 node --check
          else
            echo "No controller directory found; skipping controller syntax check."
          fi
