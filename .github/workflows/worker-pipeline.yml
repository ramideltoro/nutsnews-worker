name: Worker Pipeline

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      database_provider_mode:
        description: Production Worker database provider mode to deploy.
        required: true
        default: supabase_primary
        type: choice
        options:
          - supabase_primary
          - backend_postgres_primary
      production_writes_paused:
        description: Keep production Worker writes paused after this deploy.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      provider_switch_confirmation:
        description: Use enable-backend-postgres-primary or deploy-supabase-primary for a manual production provider deploy.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: Worker pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: worker-pipeline-ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      AI_PROVIDER: local
      AI_PROVIDER_FALLBACK_TO_OPENAI: "true"
      NUTSNEWS_ALLOW_OPENAI_FALLBACK_DEPLOYMENT: "true"
      ENABLE_LOCAL_AI_SECRET_BINDING: "true"
      LOCAL_AI_MODEL: qwen2.5:3b
      LOCAL_AI_URL: https://local-ai-ci.invalid
      LOCAL_AI_API_KEY_SECRET_NAME: LOCAL_AI_API_KEY
      NUTSNEWS_SECRETS_STORE_ID: "00000000000000000000000000000000"
      NUTSNEWS_KV_NAMESPACE_ID: "11111111111111111111111111111111"
      NUTSNEWS_KV_PREVIEW_NAMESPACE_ID: "22222222222222222222222222222222"
      NUTSNEWS_CACHE_REVALIDATION_URLS: https://www.nutsnews.com/api/internal/cache/revalidate,https://nutsnews.vercel.app/api/internal/cache/revalidate
      CLOUDFLARE_ZONE_ID: "33333333333333333333333333333333"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install Controller dependencies
        working-directory: controller
        run: npm ci

      - name: Legacy immutable test guard
        env:
          NUTSNEWS_APPROVE_IMMUTABLE_TEST_CHANGES: ${{ github.event.pull_request.number == 12 && 'true' || '' }}
        run: node scripts/check_immutable_tests.mjs

      - name: Worker pipeline immutable guard
        env:
          NUTSNEWS_APPROVE_PIPELINE_TEST_CHANGES: ${{ vars.NUTSNEWS_APPROVE_PIPELINE_TEST_CHANGES || (github.event.pull_request.number == 12 && 'true' || '') }}
        run: node scripts/check_worker_pipeline_immutable.mjs

      - name: Worker pipeline config regression
        run: node scripts/verify_worker_pipeline_config.mjs

      - name: Generate and verify local-AI Wrangler configs
        working-directory: worker
        run: npm run check:local-ai-config

      - name: Worker TypeScript check
        working-directory: worker
        run: npx tsc --noEmit

      - name: Controller syntax check
        run: |
          if [ -d controller ]; then
            find controller -path "*/node_modules/*" -prune -o -type f \( -name "*.js" -o -name "*.mjs" \) -print0 | xargs -0 -r -n1 node --check
          else
            echo "No controller directory found; skipping controller syntax check."
          fi

      - name: Local-AI deployment lock regression
        run: node scripts/assert_worker_local_ai_lock.mjs
          node scripts/assert_worker_local_ai_openai_fallback.mjs

      - name: Fully offline Worker E2E regression
        run: node scripts/worker_offline_e2e_regression.mjs

  deploy:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        ((inputs.database_provider_mode == 'backend_postgres_primary' && inputs.provider_switch_confirmation == 'enable-backend-postgres-primary') ||
         (inputs.database_provider_mode == 'supabase_primary' && inputs.provider_switch_confirmation == 'deploy-supabase-primary')))
    environment: production
    concurrency:
      group: nutsnews-controller-production-deploy
      cancel-in-progress: false
      queue: max
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUTSNEWS_SECRETS_STORE_ID: ${{ secrets.NUTSNEWS_SECRETS_STORE_ID }}
      NUTSNEWS_KV_NAMESPACE_ID: ${{ secrets.NUTSNEWS_KV_NAMESPACE_ID }}
      NUTSNEWS_KV_PREVIEW_NAMESPACE_ID: ${{ secrets.NUTSNEWS_KV_PREVIEW_NAMESPACE_ID }}
      NUTSNEWS_CACHE_REVALIDATION_URLS: ${{ vars.NUTSNEWS_CACHE_REVALIDATION_URLS || 'https://www.nutsnews.com/api/internal/cache/revalidate,https://nutsnews.vercel.app/api/internal/cache/revalidate' }}
      NUTSNEWS_CACHE_REVALIDATION_SECRET_NAME: ${{ vars.NUTSNEWS_CACHE_REVALIDATION_SECRET_NAME || 'NUTSNEWS_CACHE_REVALIDATION_SECRET' }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.NUTSNEWS_CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_CACHE_PURGE_API_TOKEN_SECRET_NAME: ${{ vars.CLOUDFLARE_CACHE_PURGE_API_TOKEN_SECRET_NAME || 'CLOUDFLARE_CACHE_PURGE_API_TOKEN' }}
      LOCAL_AI_URL: ${{ secrets.LOCAL_AI_URL }}
      LOCAL_AI_API_KEY_SECRET_NAME: ${{ secrets.LOCAL_AI_API_KEY_SECRET_NAME || 'LOCAL_AI_API_KEY' }}
      AI_PROVIDER: local
      AI_PROVIDER_FALLBACK_TO_OPENAI: "true"
      NUTSNEWS_ALLOW_OPENAI_FALLBACK_DEPLOYMENT: "true"
      ENABLE_LOCAL_AI_SECRET_BINDING: "true"
      LOCAL_AI_MODEL: qwen2.5:3b
      NUTSNEWS_WORKER_DEPLOY_CONCURRENCY: "1"
      ENABLE_UPSTASH_REDIS_SECRET_BINDING: ${{ vars.ENABLE_UPSTASH_REDIS_SECRET_BINDING || 'false' }}
      UPSTASH_REDIS_REST_URL_SECRET_NAME: ${{ vars.UPSTASH_REDIS_REST_URL_SECRET_NAME || 'UPSTASH_REDIS_REST_URL' }}
      UPSTASH_REDIS_REST_TOKEN_SECRET_NAME: ${{ vars.UPSTASH_REDIS_REST_TOKEN_SECRET_NAME || 'UPSTASH_REDIS_REST_TOKEN' }}
      ENABLED_SUMMARY_LANGUAGES: ${{ vars.ENABLED_SUMMARY_LANGUAGES || 'fr,ja,de-CH,de,el' }}
      SUMMARY_TRANSLATION_LIMIT: ${{ vars.SUMMARY_TRANSLATION_LIMIT || '5' }}
      HOLD_ARTICLES_FOR_TRANSLATIONS: ${{ vars.HOLD_ARTICLES_FOR_TRANSLATIONS || 'true' }}
      NUTSNEWS_DATABASE_PROVIDER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.database_provider_mode || vars.NUTSNEWS_DATABASE_PROVIDER_MODE || 'supabase_primary' }}
      NUTSNEWS_BACKEND_API_URL: ${{ vars.NUTSNEWS_BACKEND_API_URL || 'https://backend.nutsnews.com' }}
      NUTSNEWS_BACKEND_POSTGRES_PRIMARY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_switch_confirmation || vars.NUTSNEWS_BACKEND_POSTGRES_PRIMARY_CONFIRMATION || '' }}
      NUTSNEWS_PRODUCTION_WRITES_PAUSED: ${{ github.event_name == 'workflow_dispatch' && inputs.production_writes_paused || vars.NUTSNEWS_PRODUCTION_WRITES_PAUSED || 'false' }}
      SHARD_COUNT: "25"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install Controller dependencies
        working-directory: controller
        run: npm ci

      - name: Validate required deployment secrets
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NUTSNEWS_SECRETS_STORE_ID NUTSNEWS_KV_NAMESPACE_ID LOCAL_AI_URL NUTSNEWS_CACHE_REVALIDATION_URLS CLOUDFLARE_ZONE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate production provider switch request
        run: |
          set -euo pipefail
          case "$NUTSNEWS_DATABASE_PROVIDER_MODE" in
            supabase_primary|backend_postgres_primary) ;;
            *)
              echo "Unsupported NUTSNEWS_DATABASE_PROVIDER_MODE=$NUTSNEWS_DATABASE_PROVIDER_MODE" >&2
              exit 1
              ;;
          esac
          case "$NUTSNEWS_PRODUCTION_WRITES_PAUSED" in
            true|false) ;;
            *)
              echo "NUTSNEWS_PRODUCTION_WRITES_PAUSED must be true or false." >&2
              exit 1
              ;;
          esac
          if [ "$NUTSNEWS_DATABASE_PROVIDER_MODE" = "backend_postgres_primary" ]; then
            if [ "$NUTSNEWS_BACKEND_POSTGRES_PRIMARY_CONFIRMATION" != "enable-backend-postgres-primary" ]; then
              echo "backend_postgres_primary requires enable-backend-postgres-primary confirmation." >&2
              exit 1
            fi
            if [ -z "$NUTSNEWS_BACKEND_API_URL" ]; then
              echo "backend_postgres_primary requires NUTSNEWS_BACKEND_API_URL." >&2
              exit 1
            fi
          fi

      - name: Capture explicit live scheduling state
        id: live_scheduling
        shell: bash
        env:
          NUTSNEWS_SCHEDULING_VERIFY_MAX_ATTEMPTS: "5"
          NUTSNEWS_SCHEDULING_VERIFY_RETRY_DELAY_MS: "1000"
          NUTSNEWS_SCHEDULING_VERIFY_REQUIRED_CONSECUTIVE_PASSES: "2"
        run: |
          set -euo pipefail
          node controller/scripts/verify-ingestion-scheduling-status.mjs \
            preserve \
            "$RUNNER_TEMP/controller-ingestion-scheduling-before.json" \
            https://nutsnews-controller.nutsnews.workers.dev \
            "$GITHUB_OUTPUT"

      - name: Render and dry-run controller with preserved scheduling state
        shell: bash
        env:
          PRESERVED_INGESTION_SCHEDULING_ENABLED: ${{ steps.live_scheduling.outputs.ingestion_scheduling_enabled }}
        run: |
          set -euo pipefail
          case "$PRESERVED_INGESTION_SCHEDULING_ENABLED" in
            true|false) ;;
            *) echo "Live scheduling state was not a strict boolean." >&2; exit 1 ;;
          esac
          node controller/scripts/render-ingestion-scheduling-config.mjs \
            "$PRESERVED_INGESTION_SCHEDULING_ENABLED" \
            controller/wrangler.ingestion-preserved.generated.jsonc \
            "$RUNNER_TEMP/controller-ingestion-scheduling-render.json" \
            "$GITHUB_SHA" \
            "worker-pipeline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (
            cd controller
            npx wrangler deploy \
              --dry-run \
              -c wrangler.ingestion-preserved.generated.jsonc \
              --outdir "$RUNNER_TEMP/controller-build"
          )

      - name: Generate and verify production Wrangler configs
        working-directory: worker
        run: npm run check:local-ai-config

      - name: Deploy Worker shards to Cloudflare
        run: node scripts/deploy_worker_shards.mjs

      - name: Deploy Controller to Cloudflare
        id: deploy_controller
        shell: bash
        run: |
          set +e
          (
            cd controller
            WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/controller-wrangler-deploy.ndjson" \
              npx wrangler deploy -c wrangler.ingestion-preserved.generated.jsonc
          )
          deploy_status=$?
          set -e
          evidence_status=0
          node controller/scripts/extract-wrangler-deploy-evidence.mjs \
            "$RUNNER_TEMP/controller-wrangler-deploy.ndjson" \
            "$RUNNER_TEMP/controller-wrangler-deploy.json" \
            "$GITHUB_OUTPUT" || evidence_status=$?
          if [ "$deploy_status" -ne 0 ]; then
            exit "$deploy_status"
          fi
          exit "$evidence_status"

      - name: Verify controller retained the captured scheduling state
        env:
          PRESERVED_INGESTION_SCHEDULING_ENABLED: ${{ steps.live_scheduling.outputs.ingestion_scheduling_enabled }}
          NUTSNEWS_EXPECTED_CONTROLLER_SOURCE_REVISION: ${{ github.sha }}
          NUTSNEWS_EXPECTED_CONTROLLER_DEPLOYMENT_CORRELATION: worker-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          NUTSNEWS_EXPECTED_CONTROLLER_VERSION_ID: ${{ steps.deploy_controller.outputs.wrangler_version_id }}
          NUTSNEWS_SCHEDULING_VERIFY_MAX_ATTEMPTS: "31"
          NUTSNEWS_SCHEDULING_VERIFY_RETRY_DELAY_MS: "2000"
          NUTSNEWS_SCHEDULING_VERIFY_REQUIRED_CONSECUTIVE_PASSES: "3"
        run: >-
          node controller/scripts/verify-ingestion-scheduling-status.mjs
          "$PRESERVED_INGESTION_SCHEDULING_ENABLED"
          "$RUNNER_TEMP/controller-ingestion-scheduling-after.json"

      - name: Build value-free controller deployment checksums
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          files=()
          for candidate in \
            controller-ingestion-scheduling-before.json \
            controller-ingestion-scheduling-render.json \
            controller-ingestion-scheduling-after.json \
            controller-wrangler-deploy.ndjson \
            controller-wrangler-deploy.json; do
            if [ -f "$candidate" ]; then
              files+=("$candidate")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            sha256sum "${files[@]}" > controller-ingestion-scheduling-SHA256SUMS
          fi

      - name: Upload scheduling-preservation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: controller-ingestion-scheduling-preserve-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-ingestion-scheduling-before.json
            ${{ runner.temp }}/controller-ingestion-scheduling-render.json
            ${{ runner.temp }}/controller-ingestion-scheduling-after.json
            ${{ runner.temp }}/controller-ingestion-scheduling-SHA256SUMS
            ${{ runner.temp }}/controller-wrangler-deploy.ndjson
            ${{ runner.temp }}/controller-wrangler-deploy.json
          if-no-files-found: warn
          retention-days: 90
